<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>lamp-live</title>
<style>
:root{--bg:#f4f4f1;--panel:#fff;--ink:#1d1d1b;--sub:#6b6b66;--line:#dcdcd6;--acc:#e8a317;--acc2:#2f6fde;--red:#d43c2f}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Hiragino Sans",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700}
#conn{font-size:12px;padding:3px 8px;border-radius:99px;background:#eee;color:var(--sub)}
#conn.ok{background:#e3f4e5;color:#1f7a32}#conn.ng{background:#fbe4e1;color:var(--red)}
#ser{font-size:12px;color:var(--sub);font-family:ui-monospace,monospace}
main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.3fr);gap:12px;padding:12px 16px;max-width:1200px;margin:0 auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font-size:12px;color:var(--sub);margin:0 0 8px;font-weight:600;letter-spacing:.05em}
.lamps{display:flex;justify-content:space-around;align-items:center;padding:8px 0}
.lamp{text-align:center}
.bulb{width:110px;height:110px;border-radius:50%;background:#e9e9e4;border:2px solid var(--line);margin:0 auto 6px;transition:none}
.lamp b{font-size:20px;font-variant-numeric:tabular-nums}
.pads{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad{height:64px;border-radius:10px;border:1px solid var(--line);background:#fafaf7;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;position:relative}
.pad small{position:absolute;top:4px;left:6px;font-size:10px;color:var(--sub);font-weight:400}
.pad.on{background:var(--acc);border-color:var(--acc);color:#fff}.pad.on small{color:#fff}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;height:72px;border-radius:12px;border:1px solid var(--line);background:#fafaf7;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.btn small{display:block;font-size:10px;font-weight:400;color:var(--sub)}
#bump.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
#blackout.on{background:var(--ink);color:#fff}
#panic{background:var(--red);color:#fff;border-color:var(--red)}#panic small{color:#fde}
.fader{display:grid;grid-template-columns:7em 1fr 4em;align-items:center;gap:8px;margin:10px 0}
.fader label{font-size:13px}.fader output{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{width:100%;height:36px;accent-color:var(--acc)}
#xy{position:relative;height:240px;border-radius:12px;background:linear-gradient(to top,#efefea,#fff6df);border:1px solid var(--line);touch-action:none}
#xy .dot{position:absolute;width:28px;height:28px;margin:-14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px rgba(232,163,23,.25);pointer-events:none;display:none}
#xy .lbl{position:absolute;font-size:11px;color:var(--sub)}
#xyfs{position:absolute;top:6px;right:6px;z-index:2;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.85);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
#xy.fs{position:fixed;inset:0;z-index:100;height:auto;border-radius:0;border:none}
#xy:fullscreen{height:100%;border-radius:0;border:none}
#xy.fs .dot,#xy:fullscreen .dot{width:56px;height:56px;margin:-28px}
#xy.fs .lbl,#xy:fullscreen .lbl{font-size:16px}
.scope{display:flex;gap:8px;margin-top:8px}
.scope canvas{height:170px;border:1px solid var(--line);border-radius:8px;background:#fcfcfa}
#wave{flex:1;min-width:0}#curve{width:170px;flex:none}
.keys{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.7}
kbd{font:11px ui-monospace,monospace;background:#f0f0eb;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<header>
  <h1>lamp-live ハイビーム</h1>
  <span id="conn">接続中…</span>
  <span id="ser"></span>
</header>
<main>
  <section>
    <div class="card">
      <h2>出力</h2>
      <div class="lamps">
        <div class="lamp"><div class="bulb" id="bl"></div>左 <b id="vl">0</b>%</div>
        <div class="lamp"><div class="bulb" id="br"></div>右 <b id="vr">0</b>%</div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>ライブ</h2>
      <div class="row" style="margin-top:0">
        <button class="btn" id="bump">フラッシュ<small>押している間100% / Space</small></button>
        <button class="btn" id="tap">タップ<small>拍に合わせて連打 / T</small></button>
      </div>
      <div class="row">
        <button class="btn" id="blackout">ブラックアウト<small>切替 / B</small></button>
        <button class="btn" id="panic">全停止<small>パターン停止+消灯 / Esc</small></button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>手動 (XYパッド: 横=左右の配分, 縦=明るさ)</h2>
      <div id="xy"><div class="dot"></div><button id="xyfs">全画面</button>
        <span class="lbl" style="left:8px;bottom:6px">左</span>
        <span class="lbl" style="right:8px;bottom:6px">右</span>
        <span class="lbl" style="left:50%;top:6px;transform:translateX(-50%)">明</span></div>
      <div class="fader"><label>左</label><input type="range" id="ml" min="0" max="100" step="0.5" value="0"><output id="oml">0</output></div>
      <div class="fader"><label>右</label><input type="range" id="mr" min="0" max="100" step="0.5" value="0"><output id="omr">0</output></div>
    </div>
  </section>
  <section>
    <div class="card">
      <h2>パターン</h2>
      <div class="pads" id="pads"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>ミックス</h2>
      <div class="fader"><label>マスター</label><input type="range" id="master" min="0" max="100" step="0.5" value="100"><output id="omaster">100</output></div>
      <div class="fader"><label>パターン量</label><input type="range" id="plevel" min="0" max="100" step="0.5" value="100"><output id="oplevel">100</output></div>
      <div class="fader"><label>速さ</label><input type="range" id="speed" min="-2" max="3" step="0.01" value="0"><output id="ospeed">1.00×</output></div>
      <div class="keys">
        <kbd>1</kbd>〜<kbd>0</kbd> パターン切替(同じキーで停止) ・ <kbd>Space</kbd> フラッシュ ・ <kbd>T</kbd> タップ ・ <kbd>B</kbd> ブラックアウト ・ <kbd>Esc</kbd> 全停止 ・ <kbd>↑</kbd><kbd>↓</kbd> マスター ・ <kbd>←</kbd><kbd>→</kbd> 速さ
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>出力の調整 (ランプとの相性)</h2>
      <div class="fader"><label>PWM周波数</label><input type="range" id="freq" min="0" max="1" step="0.002" value="0.5"><output id="ofreq">1000Hz</output></div>
      <div class="fader"><label>ガンマ</label><input type="range" id="gamma" min="0.5" max="3" step="0.1" value="2.2"><output id="ogamma">2.2</output></div>
      <div class="row"><button class="btn" id="g1" style="height:44px">ガンマ 1.0<small>画面の%=出力の割合</small></button><button class="btn" id="g22" style="height:44px">ガンマ 2.2<small>LED向けの体感補正</small></button></div>
      <div class="scope"><canvas id="wave"></canvas><canvas id="curve"></canvas></div>
      <div class="keys" id="duty"></div>
      <div class="keys">波形は設定値から計算した図で、実測ではありません。左の図は出力端子の電圧(12Vと0V)、右の図はガンマのカーブ(横=画面の%、縦=出力の割合)です。</div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let ws, st = {}, patterns = [], dragging = new Set();

function send(m){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $('conn').textContent = 'サーバ接続'; $('conn').className = 'ok'; };
  ws.onclose = () => { $('conn').textContent = 'サーバ切断'; $('conn').className = 'ng'; setTimeout(connect, 1000); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.t === 'state') render(m); };
}

// 速さスライダーは log2 目盛り(-2..3 → 0.25×..8×)
const speedFromSlider = v => Math.pow(2, +v);
const sliderFromSpeed = s => Math.log2(s);
const F_MIN = 50, F_MAX = 19000;
const freqFromSlider = v => Math.round(F_MIN * Math.pow(F_MAX / F_MIN, +v));
const sliderFromFreq = f => Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN);

function setSlider(id, v, out, fmt){
  if (!dragging.has(id)) $(id).value = v;
  $(out).textContent = fmt ? fmt(v) : Math.round(v);
}

function glow(el, v){
  const a = v / 100;
  el.style.background = `rgba(255, ${200 + 55 * a | 0}, ${150 + 90 * a | 0}, ${0.15 + 0.85 * a})`;
  el.style.boxShadow = `0 0 ${10 + 60 * a}px ${a * 20}px rgba(255, 220, 140, ${a})`;
}

function render(m){
  st = m;
  const s = m.serial;
  $('ser').textContent = s.connected ? `ESP32 ${s.port}` : 'ESP32 未接続(USBを確認)';
  $('ser').style.color = s.connected ? '' : 'var(--red)';
  glow($('bl'), m.out.l); glow($('br'), m.out.r);
  $('vl').textContent = m.out.l.toFixed(0); $('vr').textContent = m.out.r.toFixed(0);
  document.querySelectorAll('.pad').forEach(p => p.classList.toggle('on', p.dataset.k === m.pattern));
  $('bump').classList.toggle('on', m.bump);
  $('blackout').classList.toggle('on', m.blackout);
  setSlider('master', m.master, 'omaster');
  setSlider('plevel', m.pattern_level, 'oplevel');
  if (!dragging.has('speed')) $('speed').value = sliderFromSpeed(m.speed);
  $('ospeed').textContent = m.speed.toFixed(2) + '×';
  if (!xyHeld) {
    if (m.xy) {
      const r = xy.getBoundingClientRect();
      dot.style.display = 'block'; dot.style.left = m.xy[0] * r.width + 'px'; dot.style.top = (1 - m.xy[1]) * r.height + 'px';
    } else dot.style.display = 'none';
  }
  setSlider('ml', m.manual_l, 'oml');
  setSlider('mr', m.manual_r, 'omr');
  if (!dragging.has('freq')) $('freq').value = sliderFromFreq(m.pwm_freq);
  $('ofreq').textContent = m.pwm_freq + 'Hz';
  setSlider('gamma', m.gamma, 'ogamma', v => (+v).toFixed(1));
  const d = v => (Math.pow(v / 100, m.gamma) * 100).toFixed(1);
  $('duty').textContent = `実際の出力(12Vを流す時間の割合): 左 ${d(m.out.l)}% ・ 右 ${d(m.out.r)}%`;
  drawScope(m);
}

// ---- 波形とガンマカーブ(設定値からの計算) ----
function fit(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  return [c, w, h];
}
function drawScope(m){
  const g = m.gamma, f = m.pwm_freq, duty = v => Math.pow(v / 100, g);
  // 表示する時間幅は周波数に合わせて切り替える(2〜20周期が入る)
  const win = f < 200 ? 0.1 : f < 2000 ? 0.01 : 0.001;
  let [c, w, h] = fit($('wave'));
  c.font = '11px -apple-system,sans-serif'; c.textBaseline = 'top';
  const rows = [['左', m.out.l, '#e8a317'], ['右', m.out.r, '#2f6fde']];
  const rh = (h - 22) / 2, px = 8, pw = w - 16;
  rows.forEach(([name, v, col], i) => {
    const d = duty(v), top = 4 + i * rh, hi = top + 18, lo = top + rh - 8;
    c.fillStyle = '#6b6b66';
    c.fillText(`${name}  ${(d * 100).toFixed(1)}%  平均 ${(d * 12).toFixed(1)}V`, px, top);
    c.strokeStyle = '#e4e4de'; c.lineWidth = 1; c.beginPath(); c.moveTo(px, lo + .5); c.lineTo(px + pw, lo + .5); c.stroke();
    c.strokeStyle = col; c.lineWidth = 2; c.beginPath();
    const P = pw / (win * f);            // 1周期の幅(px)
    if (d <= 0){ c.moveTo(px, lo); c.lineTo(px + pw, lo); }
    else if (d >= 1){ c.moveTo(px, hi); c.lineTo(px + pw, hi); }
    else for (let x = 0; x < pw; x += P){
      const e = Math.min(pw, x + P * d), n = Math.min(pw, x + P);
      c.moveTo(px + x, lo); c.lineTo(px + x, hi); c.lineTo(px + e, hi);
      if (e < pw){ c.lineTo(px + e, lo); c.lineTo(px + n, lo); }
    }
    c.stroke();
  });
  c.fillStyle = '#6b6b66'; c.textAlign = 'right';
  const per = 1000 / f;
  c.fillText(`横幅 ${win * 1000}ms ・ 1周期 ${per >= 1 ? per.toFixed(1) + 'ms' : (per * 1000).toFixed(0) + 'µs'}`, w - px, h - 15);
  c.textAlign = 'left';

  [c, w, h] = fit($('curve'));
  const m0 = 10, cw = w - 2 * m0, chh = h - 2 * m0, X = x => m0 + x * cw, Y = y => m0 + (1 - y) * chh;
  c.strokeStyle = '#e4e4de'; c.lineWidth = 1; c.strokeRect(m0 + .5, m0 + .5, cw, chh);
  c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(1), Y(1)); c.stroke(); c.setLineDash([]);
  c.strokeStyle = '#1d1d1b'; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 50; i++){ const x = i / 50; i ? c.lineTo(X(x), Y(Math.pow(x, g))) : c.moveTo(X(x), Y(0)); }
  c.stroke();
  rows.forEach(([, v, col]) => { c.fillStyle = col; c.beginPath(); c.arc(X(v / 100), Y(duty(v)), 5, 0, 7); c.fill(); });
  c.fillStyle = '#6b6b66'; c.font = '11px -apple-system,sans-serif'; c.textBaseline = 'top';
  c.fillText(`ガンマ ${g.toFixed(1)}`, m0 + 6, m0 + 4);
}

function bindRange(id, onInput){
  const el = $(id);
  el.addEventListener('pointerdown', () => dragging.add(id));
  const up = () => dragging.delete(id);
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('change', up);
  el.addEventListener('input', () => onInput(+el.value));
}
bindRange('master', v => send({t:'set', key:'master', value:v}));
bindRange('plevel', v => send({t:'set', key:'pattern_level', value:v}));
bindRange('speed',  v => send({t:'set', key:'speed', value:speedFromSlider(v)}));
bindRange('ml', v => send({t:'manual', l:v}));
// 周波数スライダーは対数目盛り(0..1 → 50Hz..19000Hz)
bindRange('freq', v => send({t:'set', key:'pwm_freq', value:freqFromSlider(v)}));
bindRange('gamma', v => send({t:'set', key:'gamma', value:v}));
$('g1').onclick = () => send({t:'set', key:'gamma', value:1});
$('g22').onclick = () => send({t:'set', key:'gamma', value:2.2});
bindRange('mr', v => send({t:'manual', r:v}));

function togglePattern(k){ send({t:'pattern', name: st.pattern === k ? null : k}); }

fetch('/api/patterns').then(r => r.json()).then(list => {
  patterns = list;
  $('pads').innerHTML = list.map((p, i) =>
    `<button class="pad" data-k="${p.key}"><small>${i < 10 ? (i + 1) % 10 : ""}</small>${p.label}</button>`).join('');
  document.querySelectorAll('.pad').forEach(p => p.onclick = () => togglePattern(p.dataset.k));
});

// フラッシュ(押している間だけ)
const bumpOn = e => { e && e.preventDefault(); send({t:'bump', on:true}); };
const bumpOff = () => send({t:'bump', on:false});
$('bump').addEventListener('pointerdown', bumpOn);
['pointerup','pointerleave','pointercancel'].forEach(ev => $('bump').addEventListener(ev, bumpOff));
$('tap').addEventListener('pointerdown', () => send({t:'tap'}));
$('blackout').onclick = () => send({t:'blackout', on: !st.blackout});
$('panic').onclick = () => send({t:'panic'});

// XYパッド: 横=配分, 縦=明るさ。離すと手動は0に戻る
const xy = $('xy'), dot = xy.querySelector('.dot');
let xyHeld = false;
function xyMove(e){
  const r = xy.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
  dot.style.display = 'block'; dot.style.left = x * r.width + 'px'; dot.style.top = (1 - y) * r.height + 'px';
  const v = y * 100;
  send({t:'manual', l: v * Math.min(1, 2 * (1 - x)), r: v * Math.min(1, 2 * x)});
}
xy.addEventListener('pointerdown', e => { xyHeld = true; xy.setPointerCapture(e.pointerId); dragging.add('ml'); dragging.add('mr'); xyMove(e); });
xy.addEventListener('pointermove', e => { if (xy.hasPointerCapture(e.pointerId)) xyMove(e); });
const xyEnd = () => { xyHeld = false; dot.style.display = 'none'; dragging.delete('ml'); dragging.delete('mr'); send({t:'manual', l:0, r:0}); };
xy.addEventListener('pointerup', xyEnd); xy.addEventListener('pointercancel', xyEnd);

// XYパッドの全画面表示。ブラウザの全画面が使えない端末(iPhone等)では画面いっぱいに広げるだけにする
const fsBtn = $('xyfs');
const fsOn = () => xy.classList.contains('fs');
function setFs(on){
  xy.classList.toggle('fs', on);
  fsBtn.textContent = on ? '閉じる' : '全画面';
  const req = xy.requestFullscreen || xy.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (on && req && !cur){ const p = req.call(xy); if (p && p.catch) p.catch(() => {}); }
    else if (!on && exit && cur){ const p = exit.call(document); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
}
fsBtn.addEventListener('pointerdown', e => e.stopPropagation());
fsBtn.addEventListener('click', e => { e.stopPropagation(); setFs(!fsOn()); });
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  if (!(document.fullscreenElement || document.webkitFullscreenElement) && fsOn()) setFs(false);
}));

// キーボード
let spaceDown = false;
addEventListener('keydown', e => {
  if (e.repeat && e.code !== 'ArrowUp' && e.code !== 'ArrowDown' && e.code !== 'ArrowLeft' && e.code !== 'ArrowRight') return;
  if (/^Digit\d$/.test(e.code)){ const i = (+e.code.slice(5) + 9) % 10; if (patterns[i]) togglePattern(patterns[i].key); }
  else if (e.code === 'Space'){ e.preventDefault(); if (!spaceDown){ spaceDown = true; bumpOn(); } }
  else if (e.code === 'KeyT') send({t:'tap'});
  else if (e.code === 'KeyB') send({t:'blackout', on: !st.blackout});
  else if (e.code === 'Escape') send({t:'panic'});
  else if (e.code === 'ArrowUp' || e.code === 'ArrowDown'){ e.preventDefault(); send({t:'set', key:'master', value: Math.max(0, Math.min(100, st.master + (e.code === 'ArrowUp' ? 5 : -5)))}); }
  else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight'){ e.preventDefault(); send({t:'set', key:'speed', value: st.speed * (e.code === 'ArrowRight' ? 1.1 : 1/1.1)}); }
});
addEventListener('keyup', e => { if (e.code === 'Space'){ spaceDown = false; bumpOff(); } });
addEventListener('blur', () => { if (spaceDown){ spaceDown = false; bumpOff(); } });

connect();
</script>
</body>
</html>
