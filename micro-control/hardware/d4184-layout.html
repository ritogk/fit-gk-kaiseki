<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D4184の実配置</title>
<style>
:root { color-scheme: light; --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --sub:#5b6675; --line:#d5dae2;
  --pw:#d9480f; --sig:#1971c2; --gnd:#343a40; }
* { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.7 -apple-system,"Hiragino Sans",sans-serif; }
main { max-width:1020px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; margin:0 0 6px; }
p { margin:6px 0; color:var(--sub); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; overflow-x:auto; margin-top:12px; }
svg { width:100%; min-width:780px; height:auto; display:block; }
text { font-family:-apple-system,"Hiragino Sans",sans-serif; fill:var(--ink); font-size:14px; }
.t { font-weight:700; font-size:15px; } .s { font-size:12px; fill:var(--sub); }
.thin { fill:none; stroke-width:2.5; stroke-linecap:round; }
.thick { fill:none; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.lg { display:inline-block; width:22px; height:4px; vertical-align:middle; margin:0 6px 0 14px; }
</style></head><body><main>
<h1>ブレッドボードとネジ端子の分け方</h1>
<p>左の水色の範囲(ESP32の信号)だけをブレッドボードで組みます。右の黄色の範囲(12Vの電流)は、D4184のネジ端子に太い電線を直接締めます。</p>
<p>
<span class="lg" style="background:var(--sig)"></span>信号線(細いジャンパー線)
<span class="lg" style="background:var(--pw);height:7px"></span>12V＋(太い電線)
<span class="lg" style="background:var(--gnd);height:7px"></span>GND・ランプ−(太い電線)
</p>
<div class="card">
<svg viewBox="0 0 960 560">
  <!-- zones -->
  <rect x="10" y="10" width="420" height="540" rx="14" fill="#e7f5ff" stroke="#74c0fc" stroke-dasharray="6 5"/>
  <text class="t" x="30" y="40" style="fill:#1971c2">ブレッドボードでOK(信号のみ)</text>
  <rect x="450" y="10" width="500" height="540" rx="14" fill="#fff9db" stroke="#fcc419" stroke-dasharray="6 5"/>
  <text class="t" x="470" y="40" style="fill:#b08900">ネジ端子に直結(12Vの電流)</text>

  <!-- breadboard -->
  <rect x="40" y="70" width="360" height="300" rx="8" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
  <g fill="#ced4da">
    <!-- hole grid -->
    <script type="text/plain"></script>
  </g>
  <g id="holes"></g>
  <text class="s" x="50" y="390">ブレッドボード</text>
  <!-- ESP32 -->
  <rect x="80" y="130" width="150" height="190" rx="8" fill="#212529"/>
  <rect x="105" y="150" width="100" height="70" rx="4" fill="#868e96"/>
  <text x="112" y="190" style="fill:#fff;font-weight:700">ESP32-S3</text>
  <text x="96" y="260" style="fill:#fff;font-size:12px">USBで給電</text>
  <circle cx="240" cy="180" r="5" fill="#1971c2"/><text class="s" x="252" y="184">GPIO</text>
  <circle cx="240" cy="280" r="5" fill="#343a40"/><text class="s" x="252" y="284">GND</text>

  <!-- jumper wires to D4184 -->
  <path class="thin" stroke="var(--sig)" d="M240 180 H330 C380 180 420 210 520 210"/>
  <path class="thin" stroke="var(--gnd)" d="M240 280 H330 C390 280 430 240 520 240"/>
  <text class="s" x="300" y="430">ジャンパー線2本だけ</text>
  <text class="s" x="300" y="448">(TRIGとGND)</text>

  <!-- D4184 board -->
  <rect x="510" y="170" width="200" height="200" rx="8" fill="#1864ab"/>
  <text x="560" y="300" style="fill:#fff;font-weight:700">D4184基板</text>
  <!-- signal pins -->
  <rect x="510" y="200" width="30" height="50" fill="#e9ecef" stroke="#495057"/>
  <text class="s" x="545" y="214" style="fill:#fff">TRIG</text>
  <text class="s" x="545" y="244" style="fill:#fff">GND</text>
  <!-- screw terminals -->
  <g fill="#2f9e44" stroke="#1b4332">
    <rect x="680" y="180" width="30" height="80"/>
    <rect x="680" y="280" width="30" height="80"/>
  </g>
  <g fill="#adb5bd"><circle cx="695" cy="200" r="8"/><circle cx="695" cy="240" r="8"/><circle cx="695" cy="300" r="8"/><circle cx="695" cy="340" r="8"/></g>
  <text class="s" x="610" y="204" style="fill:#fff">OUT＋</text>
  <text class="s" x="610" y="244" style="fill:#fff">OUT−</text>
  <text class="s" x="610" y="304" style="fill:#fff">VIN＋</text>
  <text class="s" x="610" y="344" style="fill:#fff">VIN−</text>
  <text class="s" x="520" y="392">緑の部分がネジ端子</text>

  <!-- battery -->
  <rect x="780" y="430" width="150" height="90" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text class="t" x="800" y="470">12Vバッテリー</text>
  <text x="800" y="505">＋</text><text x="900" y="505">−</text>

  <!-- fuse + lamp -->
  <rect x="790" y="70" width="140" height="70" rx="12" fill="#fff3bf" stroke="#b08900" stroke-width="2"/>
  <text class="t" x="835" y="100">ランプ</text>
  <text class="s" x="800" y="128">＋</text><text class="s" x="910" y="128">−</text>

  <path class="thick" stroke="var(--pw)" d="M806 430 V300 H760 V150 H806 V140"/>
  <rect x="740" y="250" width="40" height="22" rx="4" fill="#fff" stroke="var(--pw)" stroke-width="2"/>
  <text class="s" x="742" y="266" style="font-size:11px">5A</text>
  <text class="s" x="580" y="160">ヒューズ5A経由でランプ＋へ</text>

  <path class="thick" stroke="var(--gnd)" d="M914 140 V160 H740 V240 H703"/>
  <text class="s" x="800" y="178">ランプ−をOUT−へ</text>
  <path class="thick" stroke="var(--gnd)" d="M703 340 H740 V400 H906 V430"/>
  <text class="s" x="760" y="395">VIN−をバッテリー−へ</text>
</svg>
</div>
<p>ブレッドボードに流れるのは、ESP32からD4184へ送る信号の数mAだけです。ランプの電流(ウインカー1灯で約1.75A)は、太い電線とネジ端子だけを通り、ブレッドボードには一切入りません。灯火を増やすときは、D4184とランプの組を右側に並べ、ブレッドボードからは信号線を1本ずつ足します。</p>
</main>
<script>
const g=document.getElementById('holes');let h='';
for(let y=0;y<14;y++)for(let x=0;x<17;x++){h+=`<circle cx="${55+x*20}" cy="${90+y*20}" r="2.5" fill="#ced4da"/>`;}
g.innerHTML=h;
</script>
</body></html>
